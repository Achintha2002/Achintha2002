name: Generate Trophy Image

on:
  schedule:
    - cron: "0 0 * * *"   # Runs once a day at midnight UTC
  workflow_dispatch: {}    # Lets you trigger it manually from the Actions tab

jobs:
  generate-trophy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: Achintha2002
          output_path: trophy.svg
          theme: tokyonight
          no-frame: true
          no-bg: true
          row: 1
          column: 6
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push trophy.svg
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add trophy.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "Update trophy.svg"
          git push
