name: Generate Trophy Image

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  generate-trophy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy
        run: |
          curl -sSLo trophy.svg "https://github-profile-trophy.vercel.app/?username=Achintha2002&theme=tokyonight&no-frame=true&no-bg=true&margin-w=15&row=1&column=6&cache_seconds=86400"

      - name: Commit and push trophy.svg
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add trophy.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "Update trophy.svg"
          git push
